apiVersion: v1
kind: ConfigMap
metadata:
  name: research-analyst-config
  namespace: default
  labels:
    app: research-analyst
    tier: backend
data:
  HOST: "0.0.0.0"
  PORT: "8000"
  GROQ_MODEL: "qwen/qwen3.8-27b"
  REQUEST_TIMEOUT: "60"
---
apiVersion: v1
kind: Secret
metadata:
  name: research-analyst-secret
  namespace: default
  labels:
    app: research-analyst
type: Opaque
stringData:
  GROQ_API_KEY: "gsk_your_actual_groq_api_key_here"
