apiVersion: apps/v1
kind: Deployment
metadata:
  name: research-analyst-deployment
  namespace: default
  labels:
    app: research-analyst
spec:
  replicas: 2
  selector:
    matchLabels:
      app: research-analyst
  template:
    metadata:
      labels:
        app: research-analyst
    spec:
      containers:
      - name: research-analyst-container
        image: research-analyst-agent:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - configMapRef:
            name: research-analyst-config
        - secretRef:
            name: research-analyst-secret
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: research-analyst-service
  namespace: default
  labels:
    app: research-analyst
spec:
  type: ClusterIP
  selector:
    app: research-analyst
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: research-analyst-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  rules:
  - host: research-analyst.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: research-analyst-service
            port:
              number: 80
