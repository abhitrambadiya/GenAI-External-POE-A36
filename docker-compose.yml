# ========================================================
# Docker Compose Multi-Container Orchestration
# Research Analyst — Multi-Agent Assistant
# Roll No: 36 (Even Roll Number)
# ========================================================

services:
  # FastAPI Multi-Agent Service & REST API Endpoints
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: research-analyst-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./app:/app/app:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Streamlit Interactive Web Application
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: research-analyst-ui
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./app:/app/app:ro
      - ./streamlit_app.py:/app/streamlit_app.py:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    command: ["streamlit", "run", "streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true"]
    depends_on:
      api:
        condition: service_healthy
